<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nossa História ❤️</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#fff5f7;
    text-align:center;
    color:#333;
}

.hero{
    height:100vh;
    background:url("foto-principal.jpg") center/cover;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
}

.overlay{
    background:rgba(0,0,0,0.5);
    padding:20px;
    border-radius:15px;
}

h1{
    font-size:40px;
}

#tempo{
    font-size:30px;
    color:#e91e63;
    font-weight:bold;
    margin:20px;
}

.galeria img{
    width:90%;
    max-width:300px;
    margin:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="hero">
    <div class="overlay">
        <h1>❤️ Nossa História ❤️</h1>
        <p>Você é especial para mim</p>
    </div>
</div>

<h2>Estamos juntos há</h2>
<div id="tempo"></div>

<h2>💌 Mensagem</h2>
<p style="padding:20px;">
Cada momento contigo é único.
Obrigado por fazer parte da minha vida ❤️
</p>

<h2>📸 Fotos</h2>
<div class="galeria">
    <img src="foto1.jpg">
    <img src="foto2.jpg">
    <img src="foto3.jpg">
    <img src="foto4.jpg">
</div>

<audio autoplay loop controls>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
const inicio = new Date("2024-02-14");

function atualizar(){
    const agora = new Date();
    const diff = agora - inicio;
    const dias = Math.floor(diff / (1000*60*60*24));
    document.getElementById("tempo").innerText = dias + " dias ❤️";
}

atualizar();
setInterval(atualizar,1000);
</script>

</body>
</html>
